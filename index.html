<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- 다크모드 초기화 — localStorage > OS 선호 순서. 첫 페인트 전에 실행되어야 깜빡임이 없다.
         firebase.json CSP가 이 스크립트를 sha256 해시로 허용한다 — 내용을 바꾸면 해시도 갱신할 것 -->
    <script>
      (function () {
        var t = localStorage.getItem("theme");
        if (t === "dark" || (!t && matchMedia("(prefers-color-scheme: dark)").matches)) {
          document.documentElement.classList.add("dark");
        }
      })();
    </script>

    <title>안심로드 · 부모님 여행은 편안하게, 자녀의 마음은 안심하게</title>
    <meta
      name="description"
      content="걷는 시간과 계단까지 따진 목포 하루 코스, 여행 날 소식은 사진으로"
    />

    <!-- 아이콘·매니페스트 — /generate-web-assets 스킬이 생성, scripts/check-web-assets.mjs가 배포 전 검사.
         ICO/PNG를 SVG보다 먼저 (Google 검색 결과 아이콘은 SVG를 지원하지 않음) -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/icons/icon-192.png" type="image/png" sizes="192x192" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#ffffff" />

    <!-- OG (카카오톡 미리보기 — og:image는 절대 URL 필수) -->
    <meta property="og:site_name" content="안심로드" />
    <meta property="og:title" content="안심로드" />
    <meta property="og:description" content="부모님 여행은 편안하게, 자녀의 마음은 안심하게" />
    <meta property="og:image" content="https://ansimroad.web.app/og-image.png" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <link
      rel="preload"
      href="/fonts/PretendardVariable.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <style>
      @font-face {
        font-family: "Pretendard Variable";
        src: url("/fonts/PretendardVariable.woff2") format("woff2-variations");
        font-weight: 45 920;
        font-display: swap;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
