<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <style>
      @font-face {
        font-family: "Pretendard Variable";
        src: url("../../public/fonts/PretendardVariable.woff2") format("woff2-variations");
        font-weight: 45 920;
      }
      * {
        margin: 0;
        box-sizing: border-box;
      }
      body {
        position: relative;
        overflow: hidden;
        width: 1200px;
        height: 630px;
        font-family: "Pretendard Variable", sans-serif;
        background: #f6f2ea; /* 로고 시안의 크림 */
        color: #1f2421; /* 로고 시안의 먹색 */
        display: flex;
        align-items: center;
        padding: 0 96px 40px;
        gap: 56px;
        word-break: keep-all; /* 한국어는 어절 단위로 줄바꿈 */
      }
      /* 아래 물결 띠 */
      .sea {
        position: absolute;
        left: 0;
        bottom: 0;
        width: 1200px;
        height: 120px;
      }
      img {
        position: relative;
        width: 210px;
        height: 210px;
        flex: none;
      }
      div {
        position: relative;
      }
      h1 {
        font-size: 100px;
        font-weight: 800;
        letter-spacing: -3px;
        line-height: 1;
      }
      p {
        margin-top: 26px;
        font-size: 40px;
        font-weight: 650;
        line-height: 1.35;
        white-space: pre-line; /* og.json 의 줄바꿈(
)을 그대로 */
      }
      small {
        display: block;
        margin-top: 22px;
        font-size: 28px;
        font-weight: 550;
        color: #2e7a72; /* 로고 시안의 청록 */
      }
    </style>
  </head>
  <body>
    <svg class="sea" viewBox="0 0 1200 120" preserveAspectRatio="none" aria-hidden="true">
      <path
        d="M0 60c100-40 200-40 300 0s200 40 300 0 200-40 300 0 200 40 300 0v60H0z"
        fill="#1f5f99"
        fill-opacity="0.1"
      />
      <path
        d="M0 60c100-40 200-40 300 0s200 40 300 0 200-40 300 0 200 40 300 0"
        fill="none"
        stroke="#1f5f99"
        stroke-opacity="0.45"
        stroke-width="6"
      />
    </svg>
    <img src="../../public/brand/mark.svg" alt="" />
    <div>
      <h1 id="name"></h1>
      <p id="tagline"></p>
      <small id="sub"></small>
    </div>
  </body>
</html>
