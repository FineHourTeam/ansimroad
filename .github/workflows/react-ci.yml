# REACT_FIREBASE_SETUP.md 3단계 참조 — .github/workflows/react-ci.yml로 복사해서 사용
# 22은 프로젝트 Node 버전에 맞춰 고정할 것 (예: 22)
# 검증 목록은 CLAUDE.md/knowledge/rules.md의 검증 명령어 4종과 동일해야 한다 (로컬 통과 = CI 통과)

name: React CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22" # 예: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npx prettier --check .

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test -- --run --coverage

      - name: Build
        run: npm run build

      - name: Audit (high 이상만 실패)
        run: npm audit --audit-level=high
        continue-on-error: true # 도입 초기엔 경고만 — 안정화 후 이 줄 제거해 강제

  # E2E — 모든 화면(사용자 · 어르신 · 리포트 · 운영진)과 보안 규칙을 Firebase 에뮬레이터 위에서 확인한다.
  # playwright webServer 가 에뮬레이터(auth · firestore · storage)와 vite(--mode e2e)를 띄운다. 실제 프로젝트 데이터는 건드리지 않는다.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/setup-java@v4 # Firebase 에뮬레이터용
        with:
          distribution: temurin
          java-version: "21"
      - run: npm ci
      - name: Functions 단위 테스트
        run: npm ci --prefix functions && npm test --prefix functions
      - name: Playwright 브라우저 설치
        run: npx playwright install --with-deps chromium
      - name: E2E
        run: npx playwright test
        env:
          E2E_RESET: "1"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
